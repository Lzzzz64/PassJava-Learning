server:
  port: 8083

spring:
  application:
    name: passjava-study

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/passjava_study?serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
      micrometer:
        enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: rabbitmq
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: /

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: ${JWT_SECRET}


management:
  server:
    port: 9091

  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
      connect-timeout: 5s
      read-timeout: 10s

  observations:
    annotations:
      enabled: true