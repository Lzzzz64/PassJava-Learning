server:
  port: 8083

spring:
  application:
    name: passjava-study

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/passjava_study?serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: ${JWT_SECRET}
