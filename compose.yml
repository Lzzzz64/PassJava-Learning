
services:
  mysql:
    image: mysql:8.0
    command: --skip-character-set-client-handshake
    container_name: passjava-mysql
    restart: unless-stopped

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: passjava_question

    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: passjava-nacos
    restart: unless-stopped

    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"

      # Nacos 启动必需的认证参数
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN}"
      NACOS_AUTH_IDENTITY_KEY: "passjava"
      NACOS_AUTH_IDENTITY_VALUE: "passjava-local"

      # JVM 内存配置
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m

    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"

    volumes:
      - nacos_data:/home/nacos/data

volumes:
  mysql_data:
  nacos_data:
