
name: PassJava CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - master

  workflow_dispatch:

# 最小权限原则
permissions:
  contents: read

# 同一分支有新提交时，取消旧的重复构建
concurrency:
  group: passjava-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-test:

    name: Build And Test

    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:

      # 1. 获取 GitHub 仓库代码
      - name: Checkout source
        uses: actions/checkout@v7

      # 2. 安装 JDK 17，并缓存 Maven 依赖
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      # 3. 检查 Java 和 Maven
      - name: Show environment
        run: |
          java -version
          mvn -version

      # 4. 检查 Docker 是否可用
      - name: Check Docker
        run: docker info

      # 5. 构建四个微服务并运行全部测试
      - name: Build and test
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean verify

      # 6. 保存测试报告，即使测试失败也上传
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: passjava-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14

      # 7. 整理四个服务的 JAR
      - name: Collect JAR files
        if: success()
        run: |
          mkdir -p staging

          find passjava-*/target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            -exec cp {} staging/ \;

          echo "Build artifacts:"
          ls -lh staging

          test "$(find staging -maxdepth 1 -name '*.jar' | wc -l)" -ge 4

      # 8. 上传构建制品
      - name: Upload JAR artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: passjava-application-jars
          path: staging/*.jar
          if-no-files-found: error
          retention-days: 14


  publish-images:
    name: Publish ${{ matrix.service }}

    needs: build-and-test
    runs-on: ubuntu-latest

    # PR 只测试，不发布镜像
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        )
      }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            module: passjava-gateway

          - service: member
            module: passjava-member

          - service: question
            module: passjava-question

          - service: study
            module: passjava-study

    steps:

      # 1. 获取 Dockerfile 和项目配置
      - name: Checkout
        uses: actions/checkout@v6

      # 2. 下载 Task 24 生成的 JAR 制品
      - name: Download JAR artifacts
        uses: actions/download-artifact@v8
        with:
          name: passjava-application-jars
          path: staging

      # 3. 检查当前服务的 JAR
      - name: Locate application JAR
        id: jar
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          ls -lh staging

          JAR="staging/${{ matrix.module }}-1.0-SNAPSHOT.jar"

          if [ ! -f "$JAR" ]; then
            echo "Missing application JAR: $JAR"
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      # 4. 规范化镜像仓库名称
      - name: Set image name
        id: image
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${OWNER}/passjava-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # 5. 准备 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 6. 登录 GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. 自动生成镜像标签和 OCI 元信息
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PassJava ${{ matrix.service }} service

      # 8. 构建并推送镜像
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile

          push: true

          platforms: linux/amd64

          build-args: |
            JAR_FILE=${{ steps.jar.outputs.path }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 9. 输出构建结果
      - name: Print image information
        run: |
          echo "Image: ${{ steps.image.outputs.name }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
