global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "passjava-services"
    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - "gateway:9091"
          - "member:9091"
          - "question:9091"
          - "study:9091"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "redis"
    static_configs:
      - targets: [ "redis-exporter:9121" ]

  - job_name: "rabbitmq"
    static_configs:
      - targets: [ "rabbitmq:15692" ]

  - job_name: "rabbitmq-queues"
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_consumer_count

    static_configs:
      - targets: [ "rabbitmq:15692" ]

  - job_name: "mysql"
    static_configs:
      - targets: [ "mysql-exporter:9104" ]

rule_files:
  - /etc/prometheus/alerts.yml